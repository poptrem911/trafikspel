<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Trafikspel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2a2f36">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@500;700;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<style>
/* Layout: asphalt header band with a moving centre line, content on a cool road-grey ground, bottom tab bar on phones */
:root{
  --bg:#e8ebee; --surface:#ffffff; --surface-2:#f3f5f7; --fg:#15191e; --muted:#5a6370; --line:#d2d7dd;
  --asphalt:#2a2f36; --asphalt-2:#363c45; --on-asphalt:#f2f3f5; --marking:#ffffff;
  --yellow:#ffcc00; --on-yellow:#1b1600; --btn:#2a2f36; --on-btn:#f2f3f5; --blue:#0f5fb3; --link:#0b55a3;
  --ok:#17824a; --ok-bg:#e1f3e8; --bad:#c3261c; --bad-bg:#fbe6e3;
  --grass:#b4cf93; --grass-2:#a3c27f; --road:#555b63; --walk:#c9ccd0; --lot:#9da2a8;
  --shadow:0 1px 2px rgba(20,25,30,.06),0 4px 16px rgba(20,25,30,.06);
  --f-display:'Overpass','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Overpass Mono',ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#1b1f24; --surface-2:#232830; --fg:#edf0f3; --muted:#9aa4b0; --line:#2f363f;
  --asphalt:#0b0d10; --asphalt-2:#1a1e24; --on-asphalt:#eef0f3; --link:#7fb4f0; --blue:#4d93e3; --btn:#2a3038; --on-btn:#eef0f3;
  --ok:#4cc27f; --ok-bg:#143322; --bad:#ff7466; --bad-bg:#3a1714;
  --grass:#3c5634; --grass-2:#35502e; --road:#4a5058; --walk:#7b8087; --lot:#62676e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#1b1f24; --surface-2:#232830; --fg:#edf0f3; --muted:#9aa4b0; --line:#2f363f;
  --asphalt:#0b0d10; --asphalt-2:#1a1e24; --on-asphalt:#eef0f3; --link:#7fb4f0; --blue:#4d93e3; --btn:#2a3038; --on-btn:#eef0f3;
  --ok:#4cc27f; --ok-bg:#143322; --bad:#ff7466; --bad-bg:#3a1714;
  --grass:#3c5634; --grass-2:#35502e; --road:#4a5058; --walk:#7b8087; --lot:#62676e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--asphalt)}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--asphalt);color:var(--on-asphalt);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.top-in{display:flex;align-items:center;gap:20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.65;margin-top:1px}
.tabs-top{display:flex;gap:4px;margin-left:auto}
.tabs-top button{background:none;border:0;padding:8px 12px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--on-asphalt);opacity:.75;cursor:pointer}
.tabs-top button:hover{opacity:1;background:var(--asphalt-2)}
.tabs-top button[aria-current="true"]{opacity:1;background:var(--yellow);color:var(--on-yellow)}
.lane{height:6px;background:repeating-linear-gradient(90deg,var(--marking) 0 26px,transparent 26px 64px);opacity:.85;animation:lane 1.6s linear infinite;background-size:64px 6px;margin-bottom:-3px}
@keyframes lane{to{background-position:-64px 0}}
.bottom{display:none}
@media (max-width:760px){
  .tabs-top{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottom button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
  .bottom button svg{width:26px;height:26px}
  .bottom button[aria-current="true"]{color:var(--fg)}
  .bottom button[aria-current="true"] .ico-bg{fill:var(--yellow)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
main{padding-block:22px 48px;display:block}

/* generic */
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.h-page{font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:-.02em;margin:4px 0 6px}
.lead{color:var(--muted);max-width:62ch;margin:0 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-family:var(--f-display);font-weight:800;font-size:16px;cursor:pointer;background:var(--btn);color:var(--on-btn);min-height:48px;text-decoration:none}
.btn.y{background:var(--yellow);color:var(--on-yellow)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.section{margin-top:30px}
.section > h2{font-size:22px;font-weight:800;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .6s}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:var(--yellow);color:var(--on-yellow);padding:0 .15em;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{color:var(--muted);font-size:17px;max-width:46ch}
.hero-scene{border-radius:18px;overflow:hidden;aspect-ratio:1/1;max-width:100%;max-height:340px;justify-self:center;width:100%;box-shadow:var(--shadow)}
.hero-scene svg{width:100%;height:100%;display:block}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-scene{max-height:260px;max-width:260px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat .meter{margin-top:10px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:16px;text-align:left;cursor:pointer;width:100%}
.mode:hover{border-color:var(--muted)}
.mode .sg{width:64px;height:64px}
.mode h3{font-size:19px;font-weight:800}
.mode p{margin:2px 0 0;color:var(--muted);font-size:14px}
.mode .go{font-family:var(--f-display);font-weight:900;font-size:22px;color:var(--muted)}
.daily{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;background:var(--asphalt);color:var(--on-asphalt);border-radius:var(--r);border:0}
.daily h3{font-size:20px;font-weight:800}
.daily p{margin:4px 0 0;opacity:.75;font-size:14px}

/* signs */
.sign{display:block;width:100%;height:100%;overflow:visible}
.sg{display:inline-block}.sg-big{width:100%;height:100%}
.sign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.sign-tile{padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center;position:relative}
.sign-tile:hover{border-color:var(--muted)}
.sign-tile .sg{width:78px;height:78px;transition:transform .25s}
.sign-tile:hover .sg{transform:scale(1.06) rotate(-2deg)}
.sign-tile > span:last-child{font-size:13.5px;font-weight:700;line-height:1.25;overflow-wrap:break-word;max-width:100%}
.plate{display:flex;align-items:center;justify-content:center;background:#eef0f2;border-radius:10px;padding:6px;overflow:hidden}
.plate img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.sign-tile .plate{width:96px;height:96px}
.sign-tile .code{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:-6px}
.seg{display:inline-flex;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin:4px 0 12px;gap:2px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--muted)}
.seg button span{font-size:12px;opacity:.8;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.vars{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.var{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:3px;cursor:pointer}
.var .plate{width:62px;height:62px;padding:4px}
details.full{margin:6px 0 0;font-size:14.5px;color:var(--muted)}
details.full summary{cursor:pointer;font-weight:700;color:var(--link)}
.sign-tile .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.sign-tile .dot.l1{background:var(--yellow)}
.sign-tile .dot.l2{background:var(--ok)}
.cat-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cat-head p{margin:4px 0 0;color:var(--muted);max-width:60ch;font-size:15px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,15,.55);animation:fade .2s}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));max-height:90%;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media (min-width:761px){.sheet{align-items:center}.sheet-in{border-radius:20px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .big{width:160px;height:160px;margin:4px auto 14px}
.sheet h2{font-size:24px;font-weight:900;text-align:center}
.sheet .cat{text-align:center;margin-top:4px}
.sheet p{max-width:60ch}
.tip{display:flex;gap:10px;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.tip b{font-family:var(--f-display)}

/* rules */
.topic-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.topic{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.topic .sg{width:52px;height:52px}
.topic h3{font-size:17px;font-weight:800}
.topic .meter{margin-top:8px}
.topic small{color:var(--muted);font-size:13px}
.lesson{display:grid;gap:12px;max-width:760px}
.lcard{padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.lcard h3{font-size:18px;font-weight:800;margin-bottom:4px}
.lcard p{margin:0;color:var(--fg)}
.lcard .sg{width:64px;height:64px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.fact{background:var(--yellow);color:var(--on-yellow);border-radius:12px;padding:8px 14px;min-width:96px}
.fact b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-size:12.5px;font-weight:700}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--muted);cursor:pointer;font-size:15px}
.stop-demo{padding:16px 18px}
.stop-demo input{width:100%;accent-color:var(--fg)}
.sd-bars{display:grid;gap:6px;margin-top:12px}
.sd-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;background:var(--surface-2);font-size:12.5px;font-weight:700}
.sd-bar i{display:flex;align-items:center;padding-left:8px;white-space:nowrap;font-style:normal;transition:width .3s}
.sd-r{background:var(--yellow);color:var(--on-yellow)}
.sd-b{background:var(--bad);color:#fff}
.sd-row{display:grid;grid-template-columns:68px 1fr;gap:8px;align-items:center;font-size:13px;font-weight:700}
.sd-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:8px}

/* scenarios */
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scen-tile{padding:10px;cursor:pointer;text-align:left;width:100%}
.scen-tile .mini{border-radius:10px;overflow:hidden;aspect-ratio:1/1;max-width:100%}
.scen-tile .mini svg{width:100%;height:100%;display:block}
.scen-tile h3{font-size:16px;font-weight:800;margin:10px 4px 2px}
.scen-tile small{margin:0 4px;color:var(--muted)}
.scene .grass{fill:var(--grass)}
.scene .grass2{fill:var(--grass-2)}
.scene .road{fill:var(--road)}
.scene .walk{fill:var(--walk)}
.scene .lot{fill:var(--lot)}
.scene .mk{fill:#fff}
.scene .dash{stroke:#fff;stroke-width:2.5;stroke-dasharray:10 12;fill:none}
.blink{animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.badge circle{fill:var(--yellow);stroke:#111;stroke-width:2}
.badge text{font-family:var(--f-display);font-weight:900;font-size:13px;fill:#111}
.badge{animation:pop .35s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}

/* session */
.session{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.ses-in{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ses-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ses-top .x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;flex:none}
.ses-title{font-family:var(--f-display);font-weight:800;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ses-count{font-family:var(--f-mono);font-weight:700;font-size:14px;color:var(--muted)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:4px 10px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--yellow);transition:width .35s}
.q-vis{display:flex;justify-content:center;margin:6px 0 14px}
.q-sign{width:min(190px,48vw);height:min(190px,48vw);animation:signIn .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes signIn{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.q-scene{width:100%;max-width:420px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.q-scene svg{display:block;width:100%;height:auto}
.q-prompt{font-family:var(--f-display);font-size:clamp(20px,4.4vw,25px);font-weight:800;line-height:1.25;margin:0 0 16px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:repeat(2,1fr)}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:16.5px;font-weight:700;line-height:1.3;transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt .cdot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.opts.grid .opt{justify-content:center;padding:14px;flex-direction:column}
.opts.grid .opt .sg{width:min(110px,30vw);height:min(110px,30vw)}
.opts.grid .opt .k{position:absolute;margin:-6px 0 0 -6px}
.opt.sel{border-color:var(--fg);background:var(--surface-2)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:16px;padding:16px 18px;border-radius:14px;border:2px solid;animation:up .3s}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb h3{font-size:19px;font-weight:900;margin-bottom:4px}
.fb.ok h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p{margin:4px 0 0}
.ses-actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.ses-actions .btn{flex:1;min-width:140px}
.result{text-align:center;padding:10px 0 4px}
.result .score{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.result h2{font-size:28px;font-weight:900;margin:10px 0 4px}
.pass{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:99px;font-weight:800;font-family:var(--f-display)}
.pass.ok{background:var(--ok-bg);color:var(--ok)}
.pass.bad{background:var(--bad-bg);color:var(--bad)}
.review{display:grid;gap:10px;margin-top:22px;text-align:left}
.rv{padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.rv .sg{width:56px;height:56px}
.rv h4{margin:0 0 4px;font-size:15.5px}
.rv p{margin:2px 0 0;font-size:14.5px}
.rv .yours{color:var(--bad)}
.rv .right{color:var(--ok);font-weight:700}

/* flashcards */
.flash{perspective:1200px;max-width:380px;margin:6px auto 0;aspect-ratio:3/4;max-height:62vh;width:100%;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:12px}
.face.back-f{transform:rotateY(180deg);overflow:auto;justify-content:flex-start}
.face .sg{width:62%;aspect-ratio:1/1}
.face.back-f .sg{width:130px;height:130px;flex:none}
.face h3{font-size:22px;font-weight:900}
.face p{margin:0;font-size:15px}
.hint{font-size:13px;color:var(--muted)}

.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--link);cursor:pointer;font-size:13.5px;text-decoration:underline}
.examcard{padding:18px 20px;display:grid;gap:10px}
.examcard h3{font-size:20px;font-weight:800}
.examcard ul{margin:0;padding-left:18px}
.hist{display:grid;gap:6px;margin-top:8px}
.hist div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:14.5px;border-bottom:1px dashed var(--line);padding:6px 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function dataToURL(d){ try{ const i=d.indexOf(','); const mime=d.slice(5,d.indexOf(';')); const bin=atob(d.slice(i+1)); const u=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k); return URL.createObjectURL(new Blob([u],{type:mime})); }catch(e){ return d; } }

function rot(p,deg){const a=deg*Math.PI/180,dx=p[0]-150,dy=p[1]-150;return [150+dx*Math.cos(a)-dy*Math.sin(a),150+dx*Math.sin(a)+dy*Math.cos(a)];}
function seg(arr,a,b){arr.push(a,b);return arr}
function quadPts(arr,p0,c,p1,n=18){for(let i=0;i<=n;i++){const t=i/n,u=1-t;arr.push([u*u*p0[0]+2*u*t*c[0]+t*t*p1[0],u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]])}return arr}
function arcPts(arr,r,a0,a1,n=30){for(let i=0;i<=n;i++){const a=(a0+(a1-a0)*i/n)*Math.PI/180;arr.push([150+r*Math.cos(a),150+r*Math.sin(a)])}return arr}
function basePath(move){
  const p=[];
  if(move==='straight') seg(p,[165,215],[165,-40]);
  if(move==='left'){ seg(p,[165,215],[165,184]); quadPts(p,[165,184],[165,135],[116,135]); p.push([-40,135]); }
  if(move==='right'){ seg(p,[165,215],[165,188]); quadPts(p,[165,188],[165,165],[188,165]); p.push([340,165]); }
  return p;
}
const CUSTOM = {
  youRound:()=>{return {intro:[[165,330],[165,230]],main:[[165,230],[165,189],...arcPts([],42,69,21).slice(1),[340,165]]}},
  blueRound:()=>({intro:arcPts([],42,265,200),main:[...arcPts([],42,200,-69),[165,-40]]}),
  ped:()=>({intro:[[40,150],[106,150]],main:[[106,150],[250,150]]}),
};
function carRoute(car){
  if(car.custom) return CUSTOM[car.custom]();
  const d=ROT[car.from];
  return {intro:[[165,330],[165,215]].map(p=>rot(p,d)), main:basePath(car.move).map(p=>rot(p,d))};
}
function mkPath(pts){const L=[0];for(let i=1;i<pts.length;i++){L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}return {pts,L,total:L[L.length-1]}}
function posAt(path,d){
  const {pts,L}=path; if(d<=0) return ang(pts[0],pts[1],pts[0]);
  for(let i=1;i<pts.length;i++){ if(L[i]>=d){const t=(d-L[i-1])/((L[i]-L[i-1])||1);const x=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,y=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t;return ang(pts[i-1],pts[i],[x,y])} }
  const n=pts.length; return ang(pts[n-2],pts[n-1],pts[n-1]);
}
function ang(a,b,p){return {x:p[0],y:p[1],a:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI+90}}

}

const reduceMotion = ()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
let animToken=0;
function animateScene(root, sc, phase){
  const token=++animToken;
  const svg=root.querySelector('svg.scene'); if(!svg) return;
  const objs={}; svg.querySelectorAll('.obj').forEach(g=>objs[g.dataset.id]=g);
  const routes={}; sc.cars.forEach(c=>{const r=carRoute(c);routes[c.id]={intro:mkPath(r.intro),main:mkPath(r.main)}});
  const place=(id,path,d)=>{const p=posAt(path,d);objs[id].setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.a.toFixed(1)})`)};
  const SPEED = reduceMotion()? 4000 : 120;
  function run(ids,kind,done){
    const t0=performance.now();
    const dur=Math.max(...ids.map(id=>routes[id][kind].total))/ (ids.includes('ped')&&kind==='main'?SPEED*0.45:SPEED)*1000;
    function step(t){
      if(token!==animToken) return;
      const k=Math.min(1,(t-t0)/dur), e=kind==='intro'?1-Math.pow(1-k,2):k*k*(3-2*k);
      ids.forEach(id=>place(id,routes[id][kind],routes[id][kind].total*e));
      if(k<1) requestAnimationFrame(step); else done&&done();
    }
    requestAnimationFrame(step);
  }
  if(phase==='intro'){
    sc.cars.forEach(c=>place(c.id,routes[c.id].intro,0));
    run(sc.cars.map(c=>c.id),'intro');
  } else {
    // nollställ till väntläge och visa ordningsnummer
    sc.cars.forEach(c=>place(c.id,routes[c.id].main,0));
    const bg=svg.querySelector('.badges'); bg.innerHTML='';
    sc.order.forEach((grp,i)=>grp.forEach(id=>{const p=posAt(routes[id].main,0);const [ox,oy]=offsetBadge(p);bg.insertAdjacentHTML('beforeend',`<g class="badge" style="animation-delay:${i*.15}s;transform-origin:${p.x+ox}px ${p.y+oy}px"><circle cx="${p.x+ox}" cy="${p.y+oy}" r="11"/><text x="${p.x+ox}" y="${p.y+oy+4.5}" text-anchor="middle">${i+1}</text></g>`)}));
    let i=0;
    const next=()=>{ if(token!==animToken||i>=sc.order.length) return; const g=sc.order[i++]; setTimeout(()=>run(g,'main',next), i===1?700:250); };
    next();
  }
}
function offsetBadge(p){ // lägg badge utanför vägen
  const dx=p.x-150, dy=p.y-150;
  if(Math.abs(dy)>Math.abs(dx)) return [dx>0?-34:34, 0];
  return [0, dy>0?-30:30];
}

function rec(key,ok){const it=P.items[key]||{b:0,r:0,w:0};if(ok){it.b=Math.min(5,it.b+1);it.r++}else{it.b=0;it.w++}it.t=Date.now();it.last=ok;P.items[key]=it;const d=today();P.days[d]=(P.days[d]||0)+1;saveP()}
const box=k=>(P.items[k]&&P.items[k].b)||0;
function signLevel(id){const s=box('sn:'+id)+box('ns:'+id);return s>=4?2:s>=1?1:0}
function ruleDone(id){return box('r:'+id)>=2}
function scenDone(id){return box('s:'+id)>=1}
function streak(){const k=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const d=new Date();if(!P.days[k(d)])d.setDate(d.getDate()-1);let n=0;while(P.days[k(d)]){n++;d.setDate(d.getDate()-1)}return n}
(function migrate(){let ch=false;for(const k of Object.keys(P.items)){const [t,id]=k.split(':');if((t==='sn'||t==='ns')&&!ITEM[id]){const n=rid(id);if(n&&!P.items[t+':'+n])P.items[t+':'+n]=P.items[k];delete P.items[k];ch=true}}if(ch)saveP()})();
const ALL_RULE_KEYS=RULES.map(r=>'r:'+r[0]);
const ALL_SCEN_KEYS=SCEN.map(s=>'s:'+s.id);
const wrongKeys=()=>Object.entries(P.items).filter(([k,v])=>v.last===false).map(([k])=>k).filter(k=>validKey(k));
function validKey(k){const [t,id]=k.split(':');return (t==='sn'||t==='ns')?!!ITEM[id]:t==='r'?!!RULE[id]:t==='s'?!!SCN[id]:false}

const $=(s,r=document)=>r.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickSmart(pool,n){return pool.map(k=>{const it=P.items[k];let p=it?it.b*10:4;if(it&&it.last===false)p-=20;if(it&&Date.now()-it.t<60000)p+=15;return [k,p+Math.random()*9]}).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0])}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

   ============================================================ */
function distractors(it,n){
  const out=[], seen=new Set([it.name]);
  const take=list=>{for(const o of shuffle(list)){if(out.length>=n)break;if(o.code===it.code||seen.has(o.name))continue;seen.add(o.name);out.push(o)}};
  take(ITEMS.filter(o=>o.cat===it.cat&&(!it.common||o.common)));
  if(out.length<n) take(ITEMS.filter(o=>o.cat===it.cat));
  if(out.length<n) take(ITEMS);
  return out;
}
const SN_PROMPT={M:'Vad betyder vägmarkeringen?',S:'Vad betyder signalen?',P:'Vad betyder tecknet?',T:'Vad anger tilläggstavlan?',X:'Vad betyder anordningen?'};
function makeQ(key){
  const [t,id]=key.split(':');
  if(t==='sn'){const s=ITEM[id];return {key,kind:'sn',prompt:SN_PROMPT[s.cat]||'Vad betyder det här vägmärket?',visual:`<div class="q-sign">${signSVG(id,'sg-big')}</div>`,opts:shuffle([{label:s.name,ok:true},...distractors(s,3).map(o=>({label:o.name}))]),exp:shortDesc(s.desc),tip:tipFor(s),sign:id,answer:s.name}}
  if(t==='ns'){const s=ITEM[id];return {key,kind:'ns',prompt:`Vilket är: <span style="background:var(--yellow);color:var(--on-yellow);padding:0 .2em;border-radius:4px">${esc(s.name)}</span>?`,visual:'',grid:true,opts:shuffle([{html:signSVG(id),label:s.name,ok:true},...distractors(s,3).map(o=>({html:signSVG(o.id),label:o.name}))]),exp:shortDesc(s.desc),tip:tipFor(s),sign:id,answer:s.name}}
  if(t==='r'){const r=RULE[id];return {key,kind:'r',prompt:esc(r.q),visual:r.sign?`<div class="q-sign" style="width:min(130px,34vw);height:min(130px,34vw)">${signSVG(r.sign,'sg-big')}</div>`:'',opts:shuffle(r.a.map((x,i)=>({label:x,ok:i===0}))),exp:r.exp,sign:r.sign,answer:r.a[0]}}
  if(t==='s'){const sc=SCN[id];const ids=[...new Set(sc.cars.map(c=>c.id))];return {key,kind:'s',scen:sc,prompt:esc(sc.q),visual:`<div class="q-scene">${sceneSVG(sc,{id:'scene'})}</div>`,opts:ids.map(cid=>({label:cid==='ped'?'Den gående':(CARCOL[cid].name+(sc.cars.find(c=>c.id===cid).you?' (du)':'')),color:CARCOL[cid].fill,id:cid,ok:cid===sc.answer})),exp:sc.exp,answer:sc.answer==='ped'?'Den gående':CARCOL[sc.answer].name+(sc.cars.find(c=>c.id===sc.answer).you?' (du)':'')}}
}

  ${vars.length?`<div class="eyebrow" style="margin-top:14px">Varianter av ${s.code}</div><div class="vars">${vars.map(v=>`<button class="var" data-sign="${v.id}" title="${esc(v.name)}">${signSVG(v.id)}</button>`).join('')}</div>`:''}
  <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn ghost" data-act="closesheet">Stäng</button><button class="btn y" data-act="quizone" data-sign="${id}">Testa märket</button></div></div>`;
  sh.hidden=false; sh.querySelector('.sheet-in').scrollTop=0;
}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}

/* ============================================================
   ÖVNINGSPASS / PROV
   ============================================================ */
let SES=null, examTimer=null;
function startSession(keys,o={}){
  keys=keys.filter(validKey); if(!keys.length) return;
  closeSheet(); clearTimeout(heroTimer); animToken++;
  SES={keys,qs:keys.map(makeQ),i:0,mode:o.mode||'practice',title:o.title||'Övning',ans:[],answered:false,limit:o.limit||0,start:Date.now()};
  $('#session').hidden=false; document.body.style.overflow='hidden';
  if(SES.limit){clearInterval(examTimer);examTimer=setInterval(tick,1000)}
  renderQ();
}
function endSession(){clearInterval(examTimer);animToken++;SES=null;$('#session').hidden=true;$('#session').innerHTML='';document.body.style.overflow='';render()}
function tick(){if(!SES||!SES.limit)return;const left=SES.limit*60-Math.floor((Date.now()-SES.start)/1000);const el=$('#timer');if(el){el.textContent=fmt(Math.max(0,left));el.classList.toggle('low',left<300)}if(left<=0){clearInterval(examTimer);finishExam()}}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function renderQ(){
  const S=SES, q=S.qs[S.i], n=S.qs.length, exam=S.mode==='exam';
  S.answered=false;
  const sel=S.ans[S.i];
  $('#session').innerHTML=`<div class="ses-in">
    <div class="ses-top"><button class="x" data-act="quit" aria-label="Avsluta">✕</button><div class="ses-title">${esc(S.title)}</div>${S.limit?`<span class="timer num" id="timer">${fmt(S.limit*60-Math.floor((Date.now()-S.start)/1000))}</span>`:''}<span class="ses-count num">${S.i+1}/${n}</span></div>
    <div class="progress"><i style="width:${(S.i/n)*100}%"></i></div>
    ${q.visual?`<div class="q-vis">${q.visual}</div>`:''}
    <h2 class="q-prompt">${q.prompt}</h2>
    <div class="opts ${q.grid?'grid':''}">${q.opts.map((o,i)=>`<button class="opt ${exam&&sel===i?'sel':''}" data-opt="${i}">${q.grid?'':`<span class="k">${i+1}</span>`}${o.color?`<span class="cdot" style="background:${o.color}"></span>`:''}${o.html?o.html:`<span>${esc(o.label)}</span>`}</button>`).join('')}</div>
    <div id="fb"></div>
    <div class="ses-actions" id="acts">${exam?`<button class="btn ghost" data-act="prev" ${S.i===0?'disabled':''}>‹ Föregående</button><button class="btn ${S.i===n-1?'y':''}" data-act="${S.i===n-1?'finish':'next'}">${S.i===n-1?'Lämna in':'Nästa ›'}</button>`:''}</div>
    ${exam?`<p class="muted num" style="text-align:center;font-size:13.5px;margin-top:14px">${S.ans.filter(a=>a!=null).length} av ${n} besvarade</p>`:''}
  </div>`;
  $('#session').scrollTop=0;
  if(q.kind==='s' && !exam) animateScene($('#session'),q.scen,'intro');
}
function choose(i){
  const S=SES,q=S.qs[S.i];
  if(S.mode==='exam'){S.ans[S.i]=i;document.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));const c=$('.ses-in p.muted');if(c)c.textContent=`${S.ans.filter(a=>a!=null).length} av ${S.qs.length} besvarade`;return}
  if(S.answered) return; S.answered=true; S.ans[S.i]=i;
  const ok=!!q.opts[i].ok; rec(q.key,ok); if(!ok) vib(120);
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
  const right=q.opts.find(o=>o.ok);
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}" role="status"><h3>${ok?'Rätt!':'Inte riktigt'}</h3>${ok?'':`<p><b>Rätt svar:</b> ${esc(right.label)}</p>`}<p>${q.exp}</p>${q.tip?`<p class="muted" style="margin-top:8px"><b>Tänk på:</b> ${q.tip}</p>`:''}</div>`;
  $('#acts').innerHTML=`${q.kind==='s'?`<button class="btn ghost" data-act="replay">Spela upp igen</button>`:''}<button class="btn y" data-act="next">${S.i===S.qs.length-1?'Se resultat':'Nästa ›'}</button>`;
  if(q.kind==='s') animateScene($('#session'),q.scen,'main');
  setTimeout(()=>{const a=$('#acts');a&&a.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'nearest'})},120);
}
function next(){const S=SES;if(S.i<S.qs.length-1){S.i++;renderQ()}else{S.mode==='exam'?finishExam():finishPractice()}}
function finishPractice(){
  const S=SES; const res=S.qs.map((q,i)=>({q,a:S.ans[i],ok:S.ans[i]!=null&&!!q.opts[S.ans[i]].ok}));
  const score=res.filter(r=>r.ok).length, wrong=res.filter(r=>!r.ok);
  showResult({score,total:res.length,wrong,exam:false});
}
function finishExam(){
  const S=SES; clearInterval(examTimer);
  const res=S.qs.map((q,i)=>({q,a:S.ans[i],ok:S.ans[i]!=null&&!!q.opts[S.ans[i]].ok}));
  res.forEach(r=>rec(r.q.key,r.ok));
  const score=res.filter(r=>r.ok).length;
  const d=new Date(); P.exams.push({date:d.toLocaleDateString('sv-SE')+' '+d.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'}),score,total:res.length}); saveP();
  showResult({score,total:res.length,wrong:res.filter(r=>!r.ok),exam:true});
}
function showResult({score,total,wrong,exam}){
  const pct=score/total, pass=pct>=0.8;
  const msg = pct===1?'Fullt pott!': pass?'Bra jobbat!': pct>=0.6?'Nästan där':'Fortsätt öva';
  SES.wrongKeys=wrong.map(r=>r.q.key);
  $('#session').innerHTML=`<div class="ses-in">
    <div class="ses-top"><button class="x" data-act="quit" aria-label="Stäng">✕</button><div class="ses-title">${esc(SES.title)}</div></div>
    <div class="result"><div class="score">${score}<span class="muted" style="font-size:32px">/${total}</span></div><h2>${msg}</h2>
    ${exam?`<span class="pass ${pass?'ok':'bad'}">${pass?'Godkänt':'Inte godkänt'} · gräns ${Math.ceil(total*0.8)} rätt</span>`:`<p class="muted" style="margin:4px 0 0">${wrong.length?'Frågorna du missade kommer tillbaka i Dagens övning.':'Allt rätt – de här frågorna kommer tillbaka mer sällan.'}</p>`}</div>
    <div class="ses-actions">${wrong.length?`<button class="btn y" data-act="redo">Öva felen igen (${wrong.length})</button>`:''}<button class="btn ghost" data-act="quit">Klar</button></div>
    ${wrong.length?`<div class="review"><h3 style="font-size:19px;font-weight:800">Gå igenom det du missade</h3>${wrong.map(r=>{const q=r.q;const yours=r.a!=null?q.opts[r.a].label:'Inget svar';const vis=q.sign?signSVG(q.sign):q.kind==='s'?`<span class="sg" style="display:inline-block;width:56px;height:56px;border-radius:8px;overflow:hidden">${sceneSVG(q.scen)}</span>`:'<span></span>';return `<div class="card rv">${vis}<div><h4>${q.kind==='ns'?'Vilket märke är: '+esc(q.answer)+'?':q.prompt}</h4>${q.kind!=='ns'?`<p class="yours">Ditt svar: ${esc(yours)}</p><p class="right">Rätt: ${esc(q.answer)}</p>`:`<p class="yours">Du valde: ${esc(yours)}</p>`}<p class="muted">${q.exp}</p></div></div>`}).join('')}</div>`:''}
  </div>`;
  $('#session').scrollTop=0;
}

/* Vändkort */
function startFlash(cat){
  const pool=scopeItems().filter(i=>cat==='all'||i.cat===cat); closeSheet();
  const ids=pool.length>40?pickSmart(pool.map(i=>'sn:'+i.id),30).map(k=>k.slice(3)):shuffle(pool.map(i=>i.id));
  SES={mode:'flash',title:'Vändkort · '+(cat==='all'?ALLCAT:CAT[cat]).short,list:ids.map(i=>ITEM[i]),cat,i:0,known:0};
  $('#session').hidden=false;document.body.style.overflow='hidden';renderFlash();
}
function renderFlash(){
  const S=SES,s=S.list[S.i];
  if(!s){$('#session').innerHTML=`<div class="ses-in"><div class="ses-top"><button class="x" data-act="quit">✕</button><div class="ses-title">${S.title}</div></div><div class="result"><div class="score">${S.known}<span class="muted" style="font-size:32px">/${S.list.length}</span></div><h2>kunde du direkt</h2><p class="muted">Testa dig på kategorin för att befästa märkena.</p></div><div class="ses-actions"><button class="btn y" data-act="quizcat" data-cat="${S.cat}">Testa dig</button><button class="btn ghost" data-act="quit">Klar</button></div></div>`;return}
  $('#session').innerHTML=`<div class="ses-in">
   <div class="ses-top"><button class="x" data-act="quit" aria-label="Stäng">✕</button><div class="ses-title">${S.title}</div><span class="ses-count num">${S.i+1}/${S.list.length}</span></div>
   <div class="progress"><i style="width:${S.i/S.list.length*100}%"></i></div>
   <div class="flash" id="flash" data-act="flip" role="button" tabindex="0" aria-label="Vänd kortet"><div class="flash-in">
     <div class="face">${signSVG(s.id)}<p class="hint">Vad betyder det? Tryck för att vända.</p></div>
     <div class="face back-f">${signSVG(s.id)}<h3>${esc(s.name)}</h3><p>${esc(shortDesc(s.desc))}</p>${tipFor(s)?`<p class="muted"><b>Tänk på:</b> ${tipFor(s)}</p>`:''}</div>
   </div></div>
   <div class="ses-actions" id="facts"><button class="btn ghost" data-act="flip">Vänd kortet</button></div>
  </div>`;
}
function flip(){const f=$('#flash');if(!f)return;f.classList.add('flip');$('#facts').innerHTML=`<button class="btn ghost" data-act="fno">Kunde inte</button><button class="btn y" data-act="fyes">Kunde det</button>`}
function flashAns(ok){const S=SES;const s=S.list[S.i];rec('sn:'+s.id,ok);if(ok)S.known++;S.i++;renderFlash()}

/* ============================================================
   HÄNDELSER
   ============================================================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-act],[data-cat],[data-sign],[data-topic],[data-scen],[data-opt],[data-scope]');
  if(e.target.id==='sheet'){closeSheet();return}
  if(!t) return;
  const d=t.dataset;
  if(d.opt!=null&&SES){choose(+d.opt);return}
  if(d.act){
    switch(d.act){
      case 'smart':{const wk=shuffle(wrongKeys()).slice(0,4);const pool=[...signKeys(scopeItems()),...ALL_RULE_KEYS,...ALL_SCEN_KEYS].filter(k=>!wk.includes(k));const keys=shuffle([...wk,...pickSmart(pool,12-wk.length)]);startSession(keys,{title:'Dagens övning'});return}
      case 'wrong':startSession(shuffle(wrongKeys()).slice(0,15),{title:'Mina fel'});return;
      case 'quizcat':{const c=d.cat||'all';const keys=pickSmart(signKeys(scopeItems().filter(i=>c==='all'||i.cat===c)),15);if(SES)endSession();startSession(shuffle(keys),{title:'Test · '+(c==='all'?'Alla kategorier':CAT[c].short)});return}
      case 'quizone':{const id=d.sign;startSession(['sn:'+id,'ns:'+id],{title:ITEM[id].name});return}
      case 'flash':startFlash(d.cat);return;
      case 'flip':flip();return;
      case 'fyes':flashAns(true);return;
      case 'fno':flashAns(false);return;
      case 'quiztopic':{const keys=shuffle(RULES.filter(r=>r[1]===d.topic).map(r=>'r:'+r[0]));startSession(keys,{title:TOPIC[d.topic].title});return}
      case 'scenall':startSession(shuffle(ALL_SCEN_KEYS),{title:'Vem kör först?'});return;
      case 'exam':{const n=+d.n,min=+d.min;const nS=Math.round(n*.4),nSc=Math.min(SCEN.length,Math.round(n*.1)),nR=n-nS-nSc;const sIds=shuffle(ITEMS.filter(i=>i.common)).slice(0,nS).map(s=>(Math.random()<.5?'sn:':'ns:')+s.id);const keys=shuffle([...sIds,...shuffle(ALL_RULE_KEYS).slice(0,nR),...shuffle(ALL_SCEN_KEYS).slice(0,nSc)]);startSession(keys,{mode:'exam',title:n>=65?'Fullt prov':'Snabbprov',limit:min});return}
      case 'next':next();return;
      case 'prev':if(SES.i>0){SES.i--;renderQ()}return;
      case 'finish':{const un=SES.ans.filter(a=>a!=null).length;if(un<SES.qs.length&&!t.dataset.sure){t.dataset.sure='1';t.textContent=`${SES.qs.length-un} obesvarade – lämna in ändå?`;return}finishExam();return}
      case 'replay':animateScene($('#session'),SES.qs[SES.i].scen,'main');return;
      case 'redo':{const k=SES.wrongKeys;const ti=SES.title;startSession(shuffle(k),{title:'Öva felen · '+ti.replace(/^Öva felen · /,'')});return}
      case 'quit':{if(SES&&SES.mode==='exam'&&!SES.wrongKeys&&!t.dataset.sure){t.dataset.sure='1';t.style.width='auto';t.style.padding='0 12px';t.style.borderRadius='99px';t.textContent='Avbryt provet?';return}endSession();return}
      case 'closesheet':closeSheet();return;
      case 'reset1':$('#resetZone').innerHTML=`Allt sparat raderas. <button class="linkbtn" data-act="reset2" style="color:var(--bad)">Ja, nollställ</button> · <button class="linkbtn" data-act="reset0">Avbryt</button>`;return;
      case 'reset2':P={items:{},exams:[],days:{}};saveP();render();return;
      case 'reset0':render();return;
    }
  }
  if(d.nav){if(SES)endSession();go(d.nav);return}
  if(d.scope){SCOPE=d.scope;try{localStorage.setItem('trafikspel.scope',SCOPE)}catch(e){}render();return}
  if(d.cat&&!d.act){go('signs',d.cat);return}
  if(d.sign){openSign(d.sign);return}
  if(d.topic){go('rules',d.topic);return}
  if(d.scen){const first='s:'+d.scen;startSession([first,...shuffle(ALL_SCEN_KEYS.filter(k=>k!==first))],{title:'Vem kör först?'});return}
});
document.addEventListener('input',e=>{if(e.target.id==='sdRange')updStop()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#sheet').hidden){closeSheet();return}}
  if(!SES) return;
  if(SES.mode==='flash'){if(e.key===' '||e.key==='Enter'){e.preventDefault();const f=$('#flash');if(f&&!f.classList.contains('flip'))flip()}return}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4&&SES.qs&&SES.qs[SES.i]&&n<=SES.qs[SES.i].opts.length&&!$('.result')){choose(n-1);return}
  if(e.key==='Enter'&&e.target.closest&&e.target.closest('button'))return;
  if(e.key==='Enter'&&!$('.result')){if(SES.mode==='exam'||SES.answered){e.preventDefault();next()}}
});

/* start */
try{const v=JSON.parse(localStorage.getItem('trafikspel.view'));if(v&&['home','signs','rules','scen','exam'].includes(v[0])){VIEW=v[0];SUB=v[1]}}catch(e){}
const _render=render; render=function(){_render(); if(VIEW==='rules'&&SUB==='fart') updStop();};
render();
</script>
